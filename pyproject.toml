[project]
name = "benchdiff"
version = "0.1.0"
description = "Benchmark a Git range."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
benchdiff = "benchdiff.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benchdiff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
extend-exclude = ["docs"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
